name: Release

# Push a tag like v2.0.0 to build the prebuilt (unsigned) app and attach it to a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: bash Run_Tests.command
      - name: Use the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Build universal app (unsigned)
        run: UNSIGNED=1 NO_INSTALL=1 OUT_DIR="$PWD/dist" bash Build_and_Install.command
      - name: Checksum
        run: cd dist && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            **Prebuilt download (unsigned).** Works on Apple Silicon and Intel Macs, macOS 11 or later.
            Safari needs **Develop > Allow Unsigned Extensions** turned on after every launch for this copy.
            To avoid that, build from source with your own free Apple ID: see [Install](https://github.com/jhotzfoto/tab-triage#install).
      - name: Keep the build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: tab-triage
          path: dist/
